# Updated: 2026-03-22
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── NuGet: core library ────────────────────────────────────────────────
  nuget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build Release
        run: dotnet build -c Release --no-restore

      - name: Pack
        run: dotnet pack Ephemeris/Ephemeris.csproj -c Release --no-build -o ./nupkg

      - name: Upload NuGet packages as release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: ./nupkg/*.nupkg
          generate_release_notes: true

  # ── Single-file UI: per-platform matrix ───────────────────────────────
  publish-ui:
    continue-on-error: true   # one platform failure does not fail the release
    strategy:
      fail-fast: false         # run all matrix legs even if one fails
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: Ephemeris.UI.Avalonia.exe
          - os: ubuntu-latest
            rid: linux-x64
            artifact: Ephemeris.UI.Avalonia
          - os: macos-latest
            rid: osx-x64
            artifact: Ephemeris.UI.Avalonia
          - os: macos-latest
            rid: osx-arm64
            artifact: Ephemeris.UI.Avalonia

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Publish single-file (${{ matrix.rid }})
        run: >
          dotnet publish Ephemeris.UI.Avalonia/Ephemeris.UI.Avalonia.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o Ephemeris.UI.Avalonia/bin/publish/${{ matrix.rid }}

      - name: Rename artifact for release
        shell: bash
        run: |
          SRC="Ephemeris.UI.Avalonia/bin/publish/${{ matrix.rid }}/${{ matrix.artifact }}"
          EXT="${{ matrix.rid == 'win-x64' && '.exe' || '' }}"
          DST="Ephemeris.UI.Avalonia/bin/publish/${{ matrix.rid }}/EphemerisApp-${{ matrix.rid }}${EXT}"
          mv "$SRC" "$DST"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Ephemeris.UI.Avalonia/bin/publish/${{ matrix.rid }}/EphemerisApp-${{ matrix.rid }}*
          generate_release_notes: false

