# Updated: 2026-03-09
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage

      - name: Test with coverage
        run: >
          dotnet test --project Ephemeris.Tests/Ephemeris.Tests/Ephemeris.Tests.csproj
          --no-build --configuration Release --log-level Information
          --coverage --coverage-output "${{ github.workspace }}/coverage.cobertura.xml" --coverage-output-format cobertura

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: ${{ github.workspace }}/coverage.cobertura.xml
          targetdir: coverage-report
          reporttypes: MarkdownSummaryGitHub;HtmlInline

      - name: Write coverage summary to job output
        run: cat coverage-report/SummaryGitHub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: code-coverage
          path: coverage-report/SummaryGitHub.md

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          if-no-files-found: warn
